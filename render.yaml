# Render blueprint for the workspace API (spec 009, spec 023). The web app (apps/web) deploys to
# Vercel with its root directory set to apps/web. See specs/023, "How to deploy".
#
# FREE PLAN (supervised testing): no persistent disk, so saved profiles are wiped whenever the
# service sleeps (after 15 idle minutes), restarts or redeploys. Testers are told this.
# For data that stays, change `plan` to `starter` and add this back under the service:
#   disk:
#     name: job-copilot-data
#     mountPath: /data
#     sizeGB: 1
services:
  - type: web
    name: job-copilot-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKSPACE_TOKEN_SECRET   # the same value as on the web app
        sync: false
      - key: LLM_MODEL                # for example gemini/gemini-2.5-flash
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_FALLBACK_MODELS
        sync: false
      - key: GOOGLE_CLIENT_ID       # optional: the web app's Google client, for Gmail status sync
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ERROR_WEBHOOK_URL      # optional: Slack/Discord webhook for error alerts (no personal data)
        sync: false
