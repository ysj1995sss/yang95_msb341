name: tests

on:
  push:
  pull_request:

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Server packages (same list Streamlit Cloud installs)
        run: sudo apt-get update && xargs -a packages.txt sudo apt-get install -y --no-install-recommends
      - run: pip install -r product/requirements.txt
      - name: Product test suite
        working-directory: product
        run: python -m pytest tests -q -p no:cacheprovider

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            product/requirements.txt
            apps/api/pyproject.toml
      - run: pip install -r product/requirements.txt -e "apps/api[dev]"
      - name: API test suite
        working-directory: apps/api
        run: python -m pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API container (apps/api/Dockerfile)
        run: docker build -f apps/api/Dockerfile -t job-copilot-api .
      - name: It starts and answers
        run: |
          docker run -d --name api -p 8000:8000 -e WORKSPACE_TOKEN_SECRET=$(python3 -c "print('x'*40)") job-copilot-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v2/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/auth/login)" = "404"
          docker exec api python -c "from resume_tailorer.docx_export.converter import _soffice; assert _soffice()"
