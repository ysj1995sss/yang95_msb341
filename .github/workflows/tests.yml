name: tests

on:
  push:
  pull_request:

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: product/requirements.txt
      - name: Server packages (same list Streamlit Cloud installs)
        run: sudo apt-get update && xargs -a packages.txt sudo apt-get install -y --no-install-recommends
      - run: pip install -r product/requirements.txt
      - name: Product test suite
        working-directory: product
        run: python -m pytest tests -q -p no:cacheprovider

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            product/requirements.txt
            apps/api/pyproject.toml
      - run: pip install -r product/requirements.txt -e "apps/api[dev]"
      - name: API test suite
        working-directory: apps/api
        run: python -m pytest -q -p no:cacheprovider
